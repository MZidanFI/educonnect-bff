server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/internal/courses/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/internal/users/**

            - id: website-bff
              uri: lb://website-bff
              predicates:
                - Path=/web/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8079/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: gateway